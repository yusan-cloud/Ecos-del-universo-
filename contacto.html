  <header>

  <main>
    <h2><marquee behavior="alternate">contacto</marquee></h2>
     

    <div class="contacto">
      <section class="info-contacto">
        <h3>Información de contacto</h3>
        <p><strong>Teléfono:</strong> 55 1234 5678</p>
        <p><strong>Dirección:</strong> Ecatepec de Morelos, Estado de México</p>
        <p><strong>Correo:</strong> ecosdeluniverso@ejemplo.com</p>
      </section>

      <section class="formulario">
        <h3>Formulario</h3>
        <form>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="Tu nombre">

          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com">

          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..."></textarea>

          <button type="submit">Enviar</button>
        </form>
      </section>
    </div>
  </main>
